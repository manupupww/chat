<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Salonas – Grožio Studija</title>
  <meta name="description" content="Grožio studijos asistentė. Rezervuokite vizitą per pokalbį!">
  <meta name="theme-color" content="#0f0a1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Salonas">
  <link rel="manifest" href="manifest-app.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{
      font-family:'Inter',sans-serif;
      background:#0f0a1e;
      color:#f1f5f9;
      display:flex;
      flex-direction:column;
      height:100vh;
      height:100dvh;
    }

    /* Header bar */
    .app-header{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 16px;
      background:linear-gradient(135deg,#1e1b4b,#312e81);
      border-bottom:1px solid rgba(99,102,241,.3);
      flex-shrink:0;
      z-index:10;
    }
    .app-header .logo{
      width:38px;height:38px;border-radius:10px;
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      display:flex;align-items:center;justify-content:center;
      font-size:20px;
    }
    .app-header .info h1{font-size:15px;font-weight:700;color:#fff}
    .app-header .info p{font-size:11px;color:#a5b4fc;display:flex;align-items:center;gap:4px}
    .app-header .info .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    /* Chat container - fills remaining space */
    .chat-container{
      flex:1;
      position:relative;
      overflow:hidden;
      background:#0f0a1e;
    }

    /* Loading state */
    .loading{
      position:absolute;top:0;left:0;right:0;bottom:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:16px;z-index:5;
      background:#0f0a1e;
      transition:opacity .5s;
    }
    .loading.hide{opacity:0;pointer-events:none}
    .loading .spinner{
      width:40px;height:40px;border:3px solid rgba(99,102,241,.2);
      border-top-color:#6366f1;border-radius:50%;
      animation:spin 1s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading p{color:#94a3b8;font-size:13px}

    /* Voiceflow embed styles */
    .chat-container iframe,
    .chat-container > div{
      width:100% !important;
      height:100% !important;
    }

    /* Install bar */
    .install-bar{
      display:none;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:10px 16px;
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      flex-shrink:0;
      animation:slideDown .4s ease;
    }
    .install-bar.show{display:flex}
    .install-bar p{color:#fff;font-size:13px;font-weight:500}
    .install-bar button{
      padding:7px 16px;border:2px solid #fff;border-radius:8px;
      background:transparent;color:#fff;font-size:12px;font-weight:700;
      cursor:pointer;transition:.2s;
    }
    .install-bar button:hover{background:#fff;color:#6366f1}
    @keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
  </style>
</head>
<body>

  <!-- App Header -->
  <div class="app-header">
    <div class="logo">✨</div>
    <div class="info">
      <h1>Salonas</h1>
      <p><span class="dot"></span> Grožio asistentė online</p>
    </div>
  </div>

  <!-- Install Bar -->
  <div class="install-bar" id="installBar">
    <p>📲 Įdiekite šią app!</p>
    <button id="installAppBtn">Įdiegti</button>
  </div>

  <!-- Chat Area -->
  <div class="chat-container" id="chatContainer">
    <div class="loading" id="loadingScreen">
      <div class="spinner"></div>
      <p>Jungiamės...</p>
    </div>
  </div>

  <script src="booking-extension.js"></script>
  <script>
    (function(d,t){
      var v=d.createElement(t),s=d.getElementsByTagName(t)[0];
      v.onload=function(){
        window.voiceflow.chat.load({
          verify:{projectID:'69f9d9450a38788e98a97a18'},
          url:'https://general-runtime.voiceflow.com',
          versionID:'production',
          voice:{url:"https://runtime-api.voiceflow.com"},
          assistant:{extensions:[BookingExtension]},
          render:{mode:'embedded',target:document.getElementById('chatContainer')},
          autostart:true,
        }).then(function(){
          // Hide loading screen
          setTimeout(function(){
            document.getElementById('loadingScreen').classList.add('hide');
          }, 1000);
        });
      }
      v.src="https://cdn.voiceflow.com/widget-next/bundle.mjs";v.type="text/javascript";s.parentNode.insertBefore(v,s);
    })(document,'script');
  </script>

  <script>
    // PWA Service Worker
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js');
    }

    // Install logic
    var deferredPrompt = null;
    var installBar = document.getElementById('installBar');
    var installBtn = document.getElementById('installAppBtn');
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    // Don't show install bar if already running as installed app
    if(!isStandalone){
      window.addEventListener('beforeinstallprompt', function(e){
        e.preventDefault();
        deferredPrompt = e;
        installBar.classList.add('show');
      });

      installBtn.addEventListener('click', function(){
        if(deferredPrompt){
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function(choice){
            if(choice.outcome === 'accepted') installBar.classList.remove('show');
            deferredPrompt = null;
          });
        }
      });

      window.addEventListener('appinstalled', function(){
        installBar.classList.remove('show');
      });
    }
  </script>

</body>
</html>
