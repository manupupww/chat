<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Salonas – Grožio Studija</title>
  <meta name="description" content="Grožio studijos asistentė. Rezervuokite vizitą per pokalbį!">
  <meta name="theme-color" content="#0f0a1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Salonas">
  <link rel="manifest" href="manifest-app.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{
      font-family:'Inter',sans-serif;
      background:#0f0a1e;
      color:#f1f5f9;
      display:flex;
      flex-direction:column;
      height:100vh;
      height:100dvh;
    }

    /* Header bar */
    .app-header{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 16px;
      background:linear-gradient(135deg,#1e1b4b,#312e81);
      border-bottom:1px solid rgba(99,102,241,.3);
      flex-shrink:0;
      z-index:10;
    }
    .app-header .logo{
      width:38px;height:38px;border-radius:10px;
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      display:flex;align-items:center;justify-content:center;
      font-size:20px;
    }
    .app-header .info h1{font-size:15px;font-weight:700;color:#fff}
    .app-header .info p{font-size:11px;color:#a5b4fc;display:flex;align-items:center;gap:4px}
    .app-header .info .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    /* Chat container - fills remaining space */
    .chat-container{
      flex:1;
      position:relative;
      overflow:hidden;
      background:#0f0a1e;
    }

    /* Loading state */
    .loading{
      position:absolute;top:0;left:0;right:0;bottom:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:16px;z-index:5;
      background:#0f0a1e;
      transition:opacity .5s;
    }
    .loading.hide{opacity:0;pointer-events:none}
    .loading .spinner{
      width:40px;height:40px;border:3px solid rgba(99,102,241,.2);
      border-top-color:#6366f1;border-radius:50%;
      animation:spin 1s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading p{color:#94a3b8;font-size:13px}

    /* Voiceflow embed styles */
    .chat-container iframe,
    .chat-container > div{
      width:100% !important;
      height:100% !important;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <div class="app-header">
    <div class="logo">✨</div>
    <div class="info">
      <h1>Salonas</h1>
      <p><span class="dot"></span> Grožio asistentė online</p>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-container" id="chatContainer">
    <div class="loading" id="loadingScreen">
      <div class="spinner"></div>
      <p>Jungiamės...</p>
    </div>
  </div>

  <script src="booking-extension.js"></script>
  <script>
    (function(d,t){
      var v=d.createElement(t),s=d.getElementsByTagName(t)[0];
      v.onload=function(){
        window.voiceflow.chat.load({
          verify:{projectID:'69f9d9450a38788e98a97a18'},
          url:'https://general-runtime.voiceflow.com',
          versionID:'production',
          voice:{url:"https://runtime-api.voiceflow.com"},
          assistant:{extensions:[BookingExtension]},
          render:{mode:'embedded',target:document.getElementById('chatContainer')},
          autostart:true,
        }).then(function(){
          // Hide loading screen
          setTimeout(function(){
            document.getElementById('loadingScreen').classList.add('hide');
          }, 1000);
        });
      }
      v.src="https://cdn.voiceflow.com/widget-next/bundle.mjs";v.type="text/javascript";s.parentNode.insertBefore(v,s);
    })(document,'script');
  </script>

  <script>
    // PWA Service Worker
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js');
    }

    // Auto-trigger PWA install
    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredPrompt = e;
      // Auto-trigger install immediately
      setTimeout(function(){
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(result){
          deferredPrompt = null;
        });
      }, 1500);
    });

    // iOS — show instructions modal
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    var isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    if(isIOS && !isStandalone){
      setTimeout(function(){
        var modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)';
        var box = document.createElement('div');
        box.style.cssText = 'background:linear-gradient(135deg,#1e1b4b,#312e81);border:1px solid rgba(99,102,241,.4);border-radius:18px;padding:30px 24px;max-width:340px;width:100%;text-align:center;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5)';
        box.innerHTML = '<div style="font-size:40px;margin-bottom:12px">📱</div><h3 style="font-size:18px;margin-bottom:14px">Parsisiųsti App</h3><div style="text-align:left;font-size:13px;color:#c7d2fe;line-height:1.8"><div style="margin-bottom:8px">1️⃣ Paspauskite <b style=color:#fff>⬆️ Share</b> mygtuką apačioje</div><div style="margin-bottom:8px">2️⃣ Pasirinkite <b style=color:#fff>Add to Home Screen</b></div><div>3️⃣ Paspauskite <b style=color:#fff>Add</b></div></div><p style="margin-top:14px;font-size:11px;color:#818cf8">✨ App su chatbot atsiras ekrane!</p>';
        var closeModal = document.createElement('button');
        closeModal.textContent = 'Supratau ✓';
        closeModal.style.cssText = 'margin-top:18px;padding:12px 28px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer';
        closeModal.onclick = function(){ document.body.removeChild(modal); };
        box.appendChild(closeModal);
        modal.appendChild(box);
        modal.onclick = function(e){ if(e.target === modal) document.body.removeChild(modal); };
        document.body.appendChild(modal);
      }, 2000);
    }
  </script>

</body>
</html>
